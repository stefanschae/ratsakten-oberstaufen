 (Grundsteuer A 320%-Punkte, Grundsteuer B 420%-Punkte) Neufassung der Friedhofs- und Bestattungssatzung Der Marktgemeinderat beschloss einstimmig die Neufa ssung der Satzung über die öffentliche Bestattungseinrichtung (Friedhofs- und Bestattungssatzung).", "abstimmung": "einstimmig"}, {"datum": "2024-12-12", "gremium": "Marktgemeinderat", "top": "2.5", "titel": "Erlass einer Verordnung über das Offenhalten von Verkaufsstellen (verkaufsoffener Sonntag) - Beschlussfassung (beschließend)", "hinweis": "Vor dem Hintergrund, dass zurzeit eine genaue Entwi cklung der Grundsteueraufkommen in Grundsteuer A und B für 202 5 nicht abschätzbar sind, schlug die Finanzverwaltung vor, die Hebesätze für das Jahr 2025 gleichbleibend zu belassen und für das Jahr 2026 nach Einpflege aller Schätzungen, Korrekturen und Neuanlagen im Dezember 2025 neu über die Hebesätze zu beraten. Der Marktgemeinderat beschloss einstimmig die Satzun", "abstimmung": "einstimmig"}, {"datum": "2024-12-12", "gremium": "Marktgemeinderat", "top": "3", "titel": "Bestätigung des stv. Kommandanten der Feuerwehr Oberstaufen - Beschlussfassung (beschließend)", "hinweis": "Bestätigung des stellvertretenden Kommandanten der Feuerwehr Oberstaufen Bei der Kommandantenwahl am 9. Dezember 2024 im Feu erwehrhaus Oberstaufen wurde Hans-Peter Geisenhof zum stellvertretenden Ko mmandanten gewählt.", "abstimmung": ""}, {"datum": "2024-12-12", "gremium": "Marktgemeinderat", "top": "4", "titel": "Zuschusszahlung Heimatdienst - Beschlussfassung (beschließend)", "hinweis": "Zuschusszahlung Heimatdienst Der Heimatdienst Oberstaufen ist derzeit beschäftig t mit der Aufstellung des so genannten Kohlerhauses. Der Wohnteil wurde bereits in fachmännischer Arbeit aufgerichtet. Der hintere Tennenteil soll im neuen Jahr fertiggestellt werden.", "abstimmung": ""}, {"datum": "2024-12-12", "gremium": "Marktgemeinderat", "top": "5", "titel": "Bauleitplanung; Aufstellungsbeschluss zur 1. Änderung des Bebauungsplanes \"Auf der Halde\" in Wiede : "Bauleitplanung; 1. Änderung des Bebauungsplanes \"Auf der Halde\" Wiedemannsdorf - Beratung der verschiedenen Planungsvorschläge zum flächensparenden Bauen (beschließend)", "hinweis": "Änderung des Bebauungsplanes „Auf der Halde“, Wiedemannsdorf – Beratung der verschiedenen Planungsvorschläge zum flächensparenden Bauen In der Sitzung des Marktgemeinderates am 14.09.2023 wurde die Änderung des Bebauungsplanes beschlossen, um eine dichtere Bebauung zu erreichen.", "abstimmung": ""}, {"datum": "2024-05-16", "gremium": "Marktgemeinderat", "top": "8", "titel": "Hugo-v.-Königsegg-Str. 10, Fl.-Nr. 164/7, Gemarkung Oberstaufen; Vorstellung des Konzeptes zur Neubebauung mit einem Geschäftshaus (informativ)", "hinweis": "Mai 2024 Erstellung eines Verkehrs - und Parkraumkonzeptes; Zwischenbericht zur Bestandsaufnahme Der Markt Oberstaufen beauftragte die Bernard Gruppe ZT GmbH im letzten Jahr mit der Erstellung eines Verkehrs- und Parkraumkonzeptes für den Kernort Oberstaufen.", "abstimmung": ""}, {"datum": "2024-05-16", "gremium": "Marktgemeinderat", "top": "9", "titel": "Errichtung einer Freiflächen-Photovoltaik-Anlage im Moos - Beschlussfassung (beschließend)", "hinweis": "- 5 - Errichtung einer Freiflächen-Photovoltaik-Anlage im Moos Im Bereich Im Moos soll von einem Privateigentümer eine privilegierte Freiflächen - Photovoltaik-Anlage entlang der Bahnlinie entstehen. Direkt anschließend befindet sich eine Fläche des Marktes mit ca. 900 m², die sich ebenfalls anbieten würde. Der Marktgemeinderat steht dem privilegierten Projekt positiv gegenüber und beschloss einstimmig die gemeindlic", "abstimmung": "einstimmig"}, {"datum": "2024-05-16", "gremium": "Marktgemeinderat", "top": "10", "titel": "Kindertagesstätten (informativ)", "hinweis": "", "abstimmung": ""}, {"datum": "2024-05-16", "gremium": "Marktgemeinderat", "top": "10.1", "titel": "Örtliche Bedarfsplanung für das Jahr 2024/2025 - Beschlussfassung (beschließend)", "hinweis": "Mai 2024 Erstellung eines Verkehrs - und
